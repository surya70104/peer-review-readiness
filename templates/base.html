<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · OAK Audit · Peer Review Readiness</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">OAK Audit</span>
        <span class="brand-sub">Peer Review Readiness</span>
      </div>
      <nav aria-label="Screens">
        <a href="/" class="{{ 'active' if active == 'standing' }}" {% if active == 'standing' %}aria-current="page"{% endif %}><span class="n">1</span> Standing</a>
        <a href="/scorecard" class="{{ 'active' if active == 'scorecard' }}" {% if active == 'scorecard' %}aria-current="page"{% endif %}><span class="n">2</span> Scorecard</a>
        <a href="/likely-sample" class="{{ 'active' if active == 'sample' }}" {% if active == 'sample' %}aria-current="page"{% endif %}><span class="n">3</span> Likely sample</a>
        <a href="/registers" class="{{ 'active' if active == 'registers' }}" {% if active == 'registers' %}aria-current="page"{% endif %}><span class="n">4</span> Registers</a>
        <a href="/tracker" class="{{ 'active' if active == 'tracker' }}" {% if active == 'tracker' %}aria-current="page"{% endif %}><span class="n">5</span> Review tracker</a>
      </nav>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
